<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preferencias</title>
</head>
<body>
    <form id="preferencesForm"><br><br>
        <h1>Cuáles son tus preferencias en...</h1>
        Usuario:
        <input type="text" name="usuario" id="usuario" required><br><br>
        Comida favorita:
        <input type="text" name="comida" id="comida" required><br><br>
        <input type="submit" value="Cargar">
    </form>

    <div id="result" style="display: none;">
        <br><br>
        <p id="userOutput"></p>
        <p id="comidaOutput"></p>
        <br><br>
    </div>

    <script>
        document.getElementById('preferencesForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const usuario = document.getElementById('usuario').value || "No cargaste un nombre de usuario";
            const comida = document.getElementById('comida').value || "No cargaste una comida preferida";
            
            document.getElementById('userOutput').textContent = `Hola ${usuario}`;
            document.getElementById('comidaOutput').textContent = `Tu comida preferida es: ${comida}`;
            document.getElementById('result').style.display = 'block';
        });
    </script>
</body>
</html>
